<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark squircle background gradient -->
    <radialGradient id="appBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#131B29" />
      <stop offset="60%" stop-color="#0A0F17" />
      <stop offset="100%" stop-color="#06080E" />
    </radialGradient>

    <!-- Beveled metallic border gradient -->
    <linearGradient id="bezelBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Top arm gradient (vibrant cyan to electric azure) -->
    <linearGradient id="calbyTopArm" x1="20%" y1="60%" x2="90%" y2="15%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="35%" stop-color="#0088FF" />
      <stop offset="75%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E8FF" />
    </linearGradient>

    <!-- Translucent loop cyan gradient -->
    <linearGradient id="calbyInnerLoop" x1="20%" y1="35%" x2="50%" y2="70%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Bottom arm gradient (rich royal cobalt blue) -->
    <linearGradient id="calbyBottomArm" x1="40%" y1="55%" x2="85%" y2="90%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#0047E0" />
      <stop offset="100%" stop-color="#0033C7" />
    </linearGradient>

    <!-- Drop shadow for the ribbon -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer squircle frame -->
  <rect
    x="40"
    y="40"
    width="920"
    height="920"
    rx="210"
    ry="210"
    fill="url(#appBgGrad)"
    stroke="url(#bezelBorder)"
    stroke-width="22"
  />

  <!-- Subtle inner rim line -->
  <rect
    x="54"
    y="54"
    width="892"
    height="892"
    rx="198"
    ry="198"
    fill="none"
    stroke="#334155"
    stroke-width="2"
    opacity="0.5"
  />

  <!-- Centered Ribbon 'C' -->
  <g transform="translate(142, 142) scale(0.716)" filter="url(#ribbonShadow)">
    <!-- 1. The Under/Bottom Arm Fold -->
    <path
      d="M 425 515
         L 425 580
         L 755 775
         C 788 794 800 818 780 848
         C 760 878 720 885 660 885
         C 540 885 410 830 310 755
         C 230 695 195 625 205 540
         C 210 500 225 460 250 420
         L 425 515 Z"
      fill="url(#calbyBottomArm)"
    />

    <!-- 2. The Translucent Inner Cyan Loop -->
    <path
      d="M 205 385
         C 190 450 195 530 225 600
         C 255 670 315 725 390 770
         C 435 795 480 815 530 830
         C 460 760 425 675 425 580
         L 425 515
         L 205 385 Z"
      fill="url(#calbyInnerLoop)"
      opacity="0.9"
    />

    <!-- 3. Top Arm (Folded Over) -->
    <path
      d="M 205 385
         C 205 355 225 320 260 295
         L 570 145
         C 610 125 650 130 685 155
         L 795 235
         C 825 258 820 290 785 315
         L 425 515
         L 205 385 Z"
      fill="url(#calbyTopArm)"
    />
  </g>
</svg>