<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Top arm gradient: cyan to electric blue -->
    <linearGradient id="calby-top-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="30%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Bottom arm gradient: royal electric blue to deep blue -->
    <linearGradient id="calby-bot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="50%" stop-color="#0047EB" />
      <stop offset="100%" stop-color="#0038D1" />
    </linearGradient>

    <!-- Translucent inner fold loop gradient -->
    <linearGradient id="calby-loop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft glow / shadow filters -->
    <filter id="calby-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#calby-glow)">
    <!-- 1. Bottom Arm Face -->
    <path
      d="M 428,570
         L 750,770
         C 785,792 798,818 780,845
         C 765,868 732,875 690,875
         C 580,875 420,830 310,750
         C 240,700 204,640 204,570
         L 428,570 Z"
      fill="url(#calby-bot-grad)"
    />

    <!-- 2. Inner Translucent Ribbon Fold -->
    <path
      d="M 204,380
         C 204,440 204,520 204,570
         C 230,590 320,600 428,570
         C 428,540 428,520 428,500
         C 320,500 240,460 204,380 Z"
      fill="url(#calby-loop-grad)"
    />

    <!-- 3. Top Arm Face -->
    <path
      d="M 204,380
         C 204,320 250,240 330,190
         L 580,50
         C 615,28 655,35 685,55
         L 795,130
         C 825,150 820,185 785,210
         L 428,500
         C 330,500 240,460 204,380 Z"
      fill="url(#calby-top-grad)"
    />
  </g>
</svg>