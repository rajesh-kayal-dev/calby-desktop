<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby - Reminders List</title>
<!-- Tailwind CSS CDN with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#070A11',
              surface: '#0C101A',
              raised: '#111622',
              card: '#0e1320',
              border: '#1E293B',
              borderSubtle: 'rgba(255, 255, 255, 0.08)',
              cyan: '#38BDF8',
              blue: '#2563EB',
              blueHover: '#1d4ed8',
              activeTab: 'rgba(56, 189, 248, 0.12)',
            }
          }
        }
      }
    }
  </script>
<!-- Custom Layout and Window Styling -->
<style data-purpose="desktop-window-proportions">
    body {
      background-color: #030509;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Fixed Electron Canvas Proportions */
    .electron-window {
      width: 1280px;
      height: 680px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Custom subtle scrollbar if needed, standardizing on no overflow scroll */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 4px;
    }

</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: ElectronWindow -->
<div class="electron-window bg-brand-bg rounded-2xl overflow-hidden flex flex-col relative border border-brand-border" data-purpose="electron-application-window">
<!-- BEGIN: TitleBar -->
<header class="h-11 bg-brand-surface border-b border-brand-border/60 flex items-center justify-between px-4 select-none shrink-0" data-purpose="window-title-bar">
<!-- Brand Logo and App Identity -->
<div class="flex items-center space-x-2.5">
<!-- Calby Soundwave Icon (3 cyan bars) -->
<div aria-label="Calby Logo" class="flex items-center space-x-[2.5px] h-4">
<span class="w-[3px] h-2.5 bg-brand-cyan rounded-full"></span>
<span class="w-[3px] h-4 bg-brand-cyan rounded-full"></span>
<span class="w-[3px] h-2 bg-brand-cyan rounded-full"></span>
</div>
<span class="text-sm font-semibold tracking-wide text-white">Calby</span>
</div>
<!-- Window Status & Controls -->
<div class="flex items-center space-x-5">

<div class="flex items-center space-x-2 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
<span class="text-xs font-medium text-emerald-400">Connected</span>
</div>
<!-- Settings Gear Icon -->
<button aria-label="Settings" class="text-slate-400 hover:text-white transition-colors" title="Settings" type="button">

<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>

<div class="flex items-center space-x-3 text-slate-400 pl-1 border-l border-brand-border">

<button aria-label="Minimize" class="w-3.5 h-3.5 flex items-center justify-center hover:text-white transition-colors" title="Minimize" type="button">
<span class="w-3 h-0.5 bg-current rounded-full"></span>
</button>
<!-- Maximize -->
<button aria-label="Maximize" class="w-3.5 h-3.5 flex items-center justify-center hover:text-white transition-colors" title="Maximize" type="button">
<span class="w-2.5 h-2.5 border border-current rounded-sm"></span>
</button>
<!-- Close -->
<button aria-label="Close" class="w-3.5 h-3.5 flex items-center justify-center hover:text-rose-400 transition-colors" title="Close" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: TitleBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-8 pt-4 pb-6 flex flex-col overflow-hidden" data-purpose="main-reminders-view">

<div class="mb-2">
<a class="inline-flex items-center text-xs text-slate-400 hover:text-brand-cyan transition-colors font-medium group" href="#">

<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>

<div class="flex items-center justify-between mb-3.5">

<span>Upcoming</span>
<span class="px-1.5 py-0.2 rounded-full text-[10px] bg-brand-cyan/20 text-brand-cyan font-bold">4</span>

<span>Completed</span>
<span class="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-800 text-slate-400 font-semibold">2</span>

<div class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase pl-1">

<article class="flex items-center justify-between px-4 py-2 bg-brand-surface hover:bg-brand-card border border-brand-border rounded-xl transition-all group" data-purpose="reminder-card">
<div class="flex items-center space-x-4">
<!-- Radio / Circle Checkbox -->
<button aria-label="Mark complete" class="w-4 h-4 rounded-full border border-slate-500 hover:border-brand-cyan transition-colors flex items-center justify-center cursor-pointer" type="button"></button>

</svg>
</button>
</div>
</article>
</div>

<div class="space-y-1.5">
<div class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase pl-1">

          </div>
<!-- Item 3: Submit assignment -->
<article class="flex items-center justify-between px-4 py-2 bg-brand-surface hover:bg-brand-card border border-brand-border rounded-xl transition-all group" data-purpose="reminder-card">
<div class="flex items-center space-x-4">
<!-- Radio / Circle Checkbox -->
<button aria-label="Mark complete" class="w-4 h-4 rounded-full border border-slate-500 hover:border-brand-cyan transition-colors flex items-center justify-center cursor-pointer" type="button"></button>

<div class="space-y-1.5">

<article class="flex items-center justify-between px-4 py-2 bg-brand-surface hover:bg-brand-card border border-brand-border rounded-xl transition-all group" data-purpose="reminder-card">
<div class="flex items-center space-x-4">

<button aria-label="Mark incomplete" class="w-4 h-4 rounded-full border border-sky-400 bg-brand-cyan/20 flex items-center justify-center cursor-pointer" type="button">

<span class="text-xs font-semibold text-slate-200 w-16 tracking-tight">05:00 PM</span>
<!-- Details: Title & Badge -->
<div class="flex flex-col sm:flex-row sm:items-center sm:space-x-3">

<div class="flex items-center space-x-1 text-[11px] text-sky-400/90 font-medium">
