<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby — Voice Assistant (Listening State)</title>
<!-- Inter Google Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              darkest: '#05070B',
              bg: '#070A11',
              card: '#0B0F19',
              surface: '#111726',
              accent: '#00d2ff',
              cyan: '#38bdf8',
            }
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styling -->
<style data-purpose="custom-animations">
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.35;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    @keyframes soundwave-bar {
      0%, 100% {
        transform: scaleY(0.45);
      }
      50% {
        transform: scaleY(1);
      }
    }

    .pulse-animation-slow {
      animation: pulse-ring 4s ease-in-out infinite;
    }

    .pulse-animation-fast {
      animation: pulse-ring 2.5s ease-in-out infinite alternate;
    }

    .bar-anim-1 { animation: soundwave-bar 1.1s ease-in-out infinite 0.1s; }
    .bar-anim-2 { animation: soundwave-bar 0.9s ease-in-out infinite 0.25s; }
    .bar-anim-3 { animation: soundwave-bar 1.3s ease-in-out infinite 0.05s; }
    .bar-anim-4 { animation: soundwave-bar 1.0s ease-in-out infinite 0.35s; }
    .bar-anim-5 { animation: soundwave-bar 0.8s ease-in-out infinite 0.15s; }
  </style>
<!-- END: Custom Styling -->
</head>
<body class="bg-[#030508] text-slate-100 flex items-center justify-center min-h-screen p-4 font-sans select-none antialiased">
<!-- BEGIN: AppWindowContainer -->
<!-- 1280x680 Electron Desktop Window Representation -->
<main class="w-[1280px] h-[680px] bg-[#070A11] rounded-2xl border border-slate-800/80 shadow-2xl flex flex-col relative overflow-hidden backdrop-blur-xl" data-purpose="electron-desktop-frame">
<!-- BEGIN: TitleBar -->
<header class="h-14 px-6 flex items-center justify-between border-b border-white/[0.04] z-20" data-purpose="window-titlebar">
<!-- Left: Brand / Logo -->
<div class="flex items-center gap-3">
<div class="flex items-center gap-1 text-sky-400">
<span class="w-1 h-3.5 bg-sky-400 rounded-full inline-block"></span>
<span class="w-1 h-5 bg-sky-400 rounded-full inline-block"></span>
<span class="w-1 h-2 bg-sky-400 rounded-full inline-block"></span>
</div>
<span class="text-sm font-semibold tracking-wide text-slate-200">Calby</span>
</div>
<!-- Right: Status & Window Controls -->
<div class="flex items-center gap-6">
<!-- Connection Status -->
<div class="flex items-center gap-2" data-purpose="connection-status">
<span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
<span class="text-xs font-normal text-slate-400">Connected</span>
</div>
<!-- Settings Icon -->
<button aria-label="Settings" class="text-slate-400 hover:text-slate-200 transition-colors p-1" title="Settings" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
<!-- Window Action Buttons -->
<div class="flex items-center gap-3.5 text-slate-400 pl-2 border-l border-white/[0.06]" data-purpose="window-controls">
<!-- Minimize -->
<button aria-label="Minimize" class="hover:text-slate-200 transition-colors" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 12h14" stroke-linecap="round"></path>
</svg>
</button>
<!-- Maximize / Restore -->
<button aria-label="Maximize" class="hover:text-slate-200 transition-colors" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="16" rx="1.5" width="16" x="4" y="4"></rect>
</svg>
</button>
<!-- Close -->
<button aria-label="Close" class="hover:text-rose-400 transition-colors" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: TitleBar -->
<!-- BEGIN: MainContent -->
<div class="flex-1 flex flex-col items-center justify-between pt-12 pb-16 px-6 relative z-10" data-purpose="listening-interface">
<!-- Top Title State -->
<div class="text-center space-y-1">
<h1 class="text-2xl font-medium tracking-tight text-white drop-shadow-sm">Listening...</h1>
</div>
<!-- BEGIN: CenterVoiceOrb -->
<div class="relative flex items-center justify-center my-auto" data-purpose="voice-listening-orb">
<!-- Ambient Outer Glow -->
<div class="absolute w-[440px] h-[440px] rounded-full bg-cyan-600/10 blur-3xl pointer-events-none"></div>
<!-- Outermost Acoustic Resonance Wave -->
<div class="absolute w-[360px] h-[360px] rounded-full border border-sky-400/[0.07] pulse-animation-slow"></div>
<!-- Outer Acoustic Radial Ripple Wave 1 (Wider side arcs) -->
<div class="absolute w-[300px] h-[300px] rounded-full border border-sky-400/[0.18] pulse-animation-fast"></div>
<!-- Medium Acoustic Radial Ripple Wave 2 -->
<div class="absolute w-[240px] h-[240px] rounded-full border border-cyan-400/[0.35]"></div>
<!-- Primary Glowing Cyan Ring -->
<div class="relative w-36 h-36 rounded-full border-2 border-cyan-400/90 shadow-[0_0_35px_rgba(56,189,248,0.55),inset_0_0_20px_rgba(56,189,248,0.35)] flex items-center justify-center bg-[#060D18]/90">
<!-- Inner Core Subtle Glow Circle -->
<div class="absolute inset-2 rounded-full bg-gradient-to-b from-cyan-500/10 to-transparent"></div>
<!-- Active Soundwave Visualizer Bars -->
<div class="flex items-center gap-1.5 z-10" data-purpose="active-frequency-bars">
<span class="w-1 h-3.5 bg-sky-300 rounded-full bar-anim-1"></span>
<span class="w-1 h-7 bg-sky-200 rounded-full bar-anim-2"></span>
<span class="w-1.5 h-11 bg-white rounded-full shadow-[0_0_8px_#ffffff] bar-anim-3"></span>
<span class="w-1 h-6 bg-sky-200 rounded-full bar-anim-4"></span>
<span class="w-1 h-3 bg-sky-300 rounded-full bar-anim-5"></span>
</div>
</div>
<!-- Acoustic Lateral Ripple Waves (Left & Right subtle parenthetical energy brackets) -->
<div class="absolute w-[200px] h-[200px] rounded-full border-l-2 border-r-2 border-t-transparent border-b-transparent border-cyan-400/50 pointer-events-none"></div>
<div class="absolute w-[270px] h-[270px] rounded-full border-l-2 border-r-2 border-t-transparent border-b-transparent border-sky-400/30 pointer-events-none"></div>
<div class="absolute w-[330px] h-[330px] rounded-full border-l border-r border-t-transparent border-b-transparent border-sky-400/15 pointer-events-none"></div>
</div>
<!-- END: CenterVoiceOrb -->
<!-- BEGIN: LiveTranscriptionBubble -->
<!-- Rounded dark pill elevated card with transcription feedback -->
<div class="mt-auto" data-purpose="transcription-card">
<div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl bg-[#0F1422]/90 border border-slate-700/60 shadow-[0_8px_32px_rgba(0,0,0,0.45)] backdrop-blur-md">
<!-- Mini Audio Wave Icon -->
<div aria-hidden="true" class="flex items-center gap-0.5 text-sky-400/90 pl-0.5">
<span class="w-0.5 h-2 bg-sky-400 rounded-full"></span>
<span class="w-0.5 h-3.5 bg-sky-400 rounded-full"></span>
<span class="w-0.5 h-1.5 bg-sky-400 rounded-full"></span>
</div>
<!-- Quoted Live Transcription -->
<p class="text-[15px] font-normal text-slate-100 tracking-wide">
            “Remind me to call Rahul tomorrow...”
          </p>
</div>
</div>
<!-- END: LiveTranscriptionBubble -->
</div>
<!-- END: MainContent -->
<!-- BEGIN: BackgroundAmbientWaves -->
<!-- Ethereal subtle cyan/blue wave lines along the bottom -->
<div class="absolute inset-x-0 bottom-0 pointer-events-none overflow-hidden h-44 z-0 opacity-40" data-purpose="ambient-waves">
<svg class="w-full h-full object-cover" fill="none" preserveaspectratio="none" viewbox="0 0 1280 200">
<path d="M0 160 C 320 190, 480 110, 800 150 C 1040 180, 1160 130, 1280 145" stroke="url(#blueWaveGrad1)" stroke-linecap="round" stroke-width="1.2"></path>
<path d="M0 185 C 280 130, 560 195, 840 140 C 1060 100, 1180 170, 1280 160" stroke="url(#blueWaveGrad2)" stroke-linecap="round" stroke-width="1"></path>
<defs>
<lineargradient id="blueWaveGrad1" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#0284c7" stop-opacity="0"></stop>
<stop offset="50%" stop-color="#38bdf8" stop-opacity="0.65"></stop>
<stop offset="100%" stop-color="#0284c7" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="blueWaveGrad2" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#0369a1" stop-opacity="0"></stop>
<stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#0369a1" stop-opacity="0"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- END: BackgroundAmbientWaves -->
</main>
<!-- END: AppWindowContainer -->
</body></html>
