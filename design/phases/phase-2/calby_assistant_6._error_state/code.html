<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby — Error State</title>
<!-- Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#070A12',
              card: '#0D111A',
              border: '#1E2536',
              textMuted: '#94A3B8',
              error: '#EF4444',
            }
          },
          boxShadow: {
            'glow-red': '0 0 35px -5px rgba(239, 68, 68, 0.35)',
            'glow-red-lg': '0 0 70px -10px rgba(239, 68, 68, 0.25)',
          }
        }
      }
    }
  </script>
<!-- Custom CSS for specialized effects and wave lines -->
<style data-purpose="custom-styling">
    body {
      background-color: #03060C;
      font-family: 'Inter', sans-serif;
    }

    /* Ambient error background lighting */
    .error-radial-gradient {
      background: radial-gradient(circle 420px at 50% 50%, rgba(239, 68, 68, 0.08) 0%, rgba(13, 17, 26, 0) 75%);
    }

    /* Bottom wavy ambient aura */
    .subtle-wave-glow {
      background: radial-gradient(ellipse 90% 40% at 50% 100%, rgba(220, 38, 38, 0.12) 0%, transparent 80%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-rose-500/30 selection:text-white">
<!-- BEGIN: ElectronAppWindow -->
<!-- Designed precisely with 1280x680 proportions in standard viewport scale -->
<div class="relative w-full max-w-[1280px] h-[680px] bg-[#0B0E15] border border-[#1B2232] rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between select-none" data-purpose="desktop-app-container" id="calby-app-window">
<!-- Ambient background glows -->
<div class="absolute inset-0 pointer-events-none error-radial-gradient"></div>
<div class="absolute inset-x-0 bottom-0 h-72 pointer-events-none subtle-wave-glow"></div>
<!-- BEGIN: TitleBar -->
<header class="relative z-20 flex items-center justify-between px-7 py-5 h-16 border-b border-[#141A27]/80 bg-[#0B0E15]/60 backdrop-blur-md" data-purpose="window-titlebar">
<!-- Left side: Calby Brand & Waveform Logo -->
<div class="flex items-center space-x-3.5" data-purpose="brand-identity">
<!-- Minimal Calby Soundwave Glyphs -->
<div aria-hidden="true" class="flex items-center space-x-[3px] h-5">
<span class="w-[3px] h-2.5 bg-slate-300 rounded-full"></span>
<span class="w-[3px] h-5 bg-slate-200 rounded-full"></span>
<span class="w-[3px] h-3.5 bg-slate-300 rounded-full"></span>
<span class="w-[3px] h-1.5 bg-slate-400 rounded-full"></span>
</div>
<span class="text-white text-[15px] font-semibold tracking-wide">Calby</span>
</div>
<!-- Right side: Status Indicator, Settings, and Window Controls -->
<div class="flex items-center space-x-6" data-purpose="window-actions">
<!-- Disconnection Status Badge -->
<div class="flex items-center space-x-2" data-purpose="connection-status">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-60"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#EF4444]"></span>
</span>
<span class="text-xs font-medium text-slate-300">Connection lost</span>
</div>
<!-- Settings Cog Icon Button -->
<button aria-label="Settings" class="text-slate-400 hover:text-slate-200 transition-colors duration-150 p-1 rounded-md focus:outline-none" type="button">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.6 6.6 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.241.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Window Action Buttons (Minimize, Maximize, Close) -->
<div class="flex items-center space-x-3 text-slate-400 pl-1" data-purpose="window-frame-controls">
<button aria-label="Minimize" class="hover:text-white transition-colors p-0.5" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4 12h16" stroke-linecap="round"></path>
</svg>
</button>
<button aria-label="Maximize" class="hover:text-white transition-colors p-0.5" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<rect height="18" rx="2" width="18" x="3" y="3"></rect>
</svg>
</button>
<button aria-label="Close" class="hover:text-rose-400 transition-colors p-0.5" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: TitleBar -->
<!-- BEGIN: MainContent -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-8 px-6 text-center" data-purpose="error-view-content">
<!-- Error Circular Icon with Glow -->
<div class="relative flex items-center justify-center mb-6" data-purpose="error-icon-container">
<!-- Atmospheric Red Aura -->
<div class="absolute w-24 h-24 bg-red-600/20 rounded-full blur-xl pointer-events-none"></div>
<!-- Outlined Warning Circle -->
<div class="relative w-16 h-16 rounded-full border-2 border-[#EF4444] flex items-center justify-center shadow-glow-red transition-all duration-300">
<!-- Exclamation Mark -->
<span class="text-[#EF4444] text-2xl font-semibold leading-none select-none">!</span>
</div>
</div>
<!-- Error Heading -->
<h1 class="text-2xl md:text-[26px] font-semibold text-white tracking-tight mb-2.5">
        Can’t connect right now
      </h1>
<!-- Detailed Explanation -->
<p class="text-app-textMuted text-sm md:text-[14px] font-normal max-w-sm leading-relaxed mb-7">
        Please check your internet connection<br class="hidden sm:block"/> and try again.
      </p>
<!-- Primary Recovery Action: Retry Button -->
<button class="px-8 py-2.5 bg-[#1B2333] hover:bg-[#222C40] active:bg-[#182030] text-slate-200 hover:text-white border border-[#2B354D] rounded-lg text-sm font-medium tracking-wide shadow-lg shadow-black/40 transition-all duration-150 transform active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-500/50" data-purpose="retry-action-button" id="retry-button" type="button">
        Retry
      </button>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BackgroundAtmosphereVectors -->
<!-- Calm, subtle reddish waves floating across the bottom base as in Phase 2 Card 6 -->
<div class="absolute inset-x-0 bottom-0 h-44 overflow-hidden pointer-events-none select-none z-0 opacity-40" data-purpose="ambient-waves">
<svg class="w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 1280 200">
<!-- Lower smooth curve -->
<path d="M-40 180C260 140 450 190 680 160C920 128 1100 170 1320 150" stroke="url(#error-wave-gradient-1)" stroke-linecap="round" stroke-width="1.8"></path>
<!-- Intersecting secondary curve -->
<path d="M0 160C210 175 420 130 650 145C890 162 1080 120 1300 135" stroke="url(#error-wave-gradient-2)" stroke-linecap="round" stroke-width="1.2"></path>
<defs>
<lineargradient id="error-wave-gradient-1" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#DC2626" stop-opacity="0"></stop>
<stop offset="40%" stop-color="#EF4444" stop-opacity="0.35"></stop>
<stop offset="70%" stop-color="#F87171" stop-opacity="0.25"></stop>
<stop offset="100%" stop-color="#EF4444" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="error-wave-gradient-2" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#EF4444" stop-opacity="0"></stop>
<stop offset="30%" stop-color="#DC2626" stop-opacity="0.15"></stop>
<stop offset="65%" stop-color="#EF4444" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#7F1D1D" stop-opacity="0"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- END: BackgroundAtmosphereVectors -->
</div>
<!-- END: ElectronAppWindow -->
<!-- BEGIN: InteractiveScript -->
<script data-purpose="interactive-handlers">
    // Simple interactive feedback simulation for the Retry action
    const retryBtn = document.getElementById('retry-button');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        const originalText = this.textContent;
        this.textContent = 'Connecting...';
        this.classList.add('opacity-75', 'cursor-wait');
        
        setTimeout(() => {
          this.textContent = originalText;
          this.classList.remove('opacity-75', 'cursor-wait');
        }, 1200);
      });
    }
  </script>
<!-- END: InteractiveScript -->
</body></html>
