<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby — Voice Assistant (Idle State)</title>
<!-- Inter Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            calby: {
              bg: '#070A11',
              card: '#0B0E17',
              cyan: '#38bdf8',
              glow: '#0284c7',
              border: 'rgba(255, 255, 255, 0.08)',
              muted: '#94A3B8',
            }
          },
          boxShadow: {
            'orb-glow': '0 0 50px -10px rgba(56, 189, 248, 0.45), 0 0 25px -5px rgba(14, 165, 233, 0.3)',
            'mic-glow': '0 0 20px -3px rgba(56, 189, 248, 0.25)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Atmospheric Glow & Animations -->
<style data-purpose="custom-effects">
    /* Subtle pulsing effect for the idle visualizer orb */
    @keyframes orb-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 45px -8px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(56, 189, 248, 0.2);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 0 65px -4px rgba(56, 189, 248, 0.55), inset 0 0 25px rgba(56, 189, 248, 0.3);
      }
    }

    .voice-orb-glow {
      animation: orb-pulse 4s ease-in-out infinite;
    }

    /* Ambient background wave styling */
    .ethereal-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 240px;
      pointer-events: none;
      opacity: 0.75;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body class="bg-[#030508] text-white font-sans flex items-center justify-center min-h-screen p-4 select-none">
<!-- BEGIN: ElectronWindowContainer -->
<!-- 1280x680 Electron Desktop Window Container matching Phase 2 specifications -->
<div class="relative w-[1280px] h-[680px] bg-[#070A11] rounded-2xl border border-[rgba(255,255,255,0.08)] shadow-2xl flex flex-col overflow-hidden">
<!-- BEGIN: TitleBar -->
<header class="h-14 px-6 flex items-center justify-between border-b border-[rgba(255,255,255,0.04)] z-20 bg-[#070A11]/80 backdrop-blur-md">
<!-- Brand Identity / Window Title -->
<div class="flex items-center gap-2.5">
<!-- Calby Waveform Logo Icon -->
<div aria-hidden="true" class="flex items-center gap-[3px] text-cyan-400">
<span class="w-[3px] h-3 bg-cyan-400 rounded-full inline-block"></span>
<span class="w-[3px] h-5 bg-cyan-400 rounded-full inline-block"></span>
<span class="w-[3px] h-3.5 bg-cyan-400 rounded-full inline-block"></span>
</div>
<span class="font-semibold text-[15px] tracking-wide text-white">Calby</span>
</div>
<!-- Window Utility Actions & System Controls -->
<div class="flex items-center gap-5">
<!-- Connection Status Pill -->
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-xs font-medium text-emerald-400">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
<span>Connected</span>
</div>
<!-- Settings Button -->
<button aria-label="Settings" class="text-slate-400 hover:text-white transition-colors duration-150 p-1" title="Settings">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
<!-- Window Minimize/Maximize/Close Buttons -->
<div class="flex items-center gap-3.5 pl-2 text-slate-400">
<button aria-label="Minimize Window" class="hover:text-white transition-colors" title="Minimize">
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 16 16">
<path d="M2 8a.75.75 0 01.75-.75h10.5a.75.75 0 010 1.5H2.75A.75.75 0 012 8z"></path>
</svg>
</button>
<button aria-label="Maximize Window" class="hover:text-white transition-colors" title="Maximize">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 16 16">
<rect height="12" rx="1.5" width="12" x="2" y="2"></rect>
</svg>
</button>
<button aria-label="Close Window" class="hover:text-rose-400 transition-colors" title="Close">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 16 16">
<path d="M3 3l10 10M13 3L3 13" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: TitleBar -->
<!-- BEGIN: MainContentArea -->
<main class="relative flex-1 flex flex-col items-center justify-between pt-10 pb-8 px-8 z-10">
<!-- Greeting and Primary State Context -->
<div class="text-center space-y-2 mt-2">
<h1 class="text-3xl font-semibold tracking-tight text-white">
          Good morning, <span class="text-[#38bdf8]">Rajesh</span>
</h1>
<p class="text-sm font-normal text-slate-400 tracking-normal">
          How can I help you today?
        </p>
</div>
<!-- Center Voice Orb Section -->
<div class="relative flex flex-col items-center justify-center my-auto">
<!-- Glowing Cyan Ethereal Outer Halo -->
<div class="relative flex items-center justify-center">
<div class="absolute w-48 h-48 rounded-full bg-cyan-500/15 blur-2xl pointer-events-none"></div>
<!-- Main Calby Voice Orb (Circular dark orb with vibrant cyan gradient border & inner waveform) -->
<div class="voice-orb-glow w-32 h-32 rounded-full bg-[#08101C] border-[2.5px] border-cyan-400/90 flex items-center justify-center shadow-orb-glow relative cursor-pointer group transition-all duration-300">
<!-- Dynamic Voice Waveform Bars -->
<div aria-label="Voice indicator idle" class="flex items-center gap-[5px] h-10 px-4">
<span class="w-[3px] h-3 bg-white rounded-full transition-all duration-300 group-hover:h-5"></span>
<span class="w-[3px] h-6 bg-white rounded-full transition-all duration-300 group-hover:h-8"></span>
<span class="w-[3px] h-10 bg-white rounded-full transition-all duration-300 group-hover:h-9"></span>
<span class="w-[3px] h-5 bg-white rounded-full transition-all duration-300 group-hover:h-7"></span>
<span class="w-[3px] h-2 bg-white rounded-full transition-all duration-300 group-hover:h-4"></span>
</div>
</div>
</div>
<!-- Assistant Status & Subtext Hint -->
<div class="text-center mt-7 space-y-1">
<div class="text-[15px] font-medium text-white tracking-wide">
            Calby is ready
          </div>
<p class="text-xs text-slate-400 font-normal">
            Ask naturally. Just speak.
          </p>
</div>
</div>
<!-- Bottom Voice Trigger / Keyboard Shortcut Indicator -->
<div class="flex flex-col items-center gap-2 mb-2">
<!-- Microphone Button -->
<button aria-label="Activate voice listening" class="w-10 h-10 rounded-full bg-[#101726]/80 hover:bg-[#162238] border border-cyan-500/20 hover:border-cyan-400/50 flex items-center justify-center text-slate-300 hover:text-cyan-400 transition-all duration-200 shadow-mic-glow group cursor-pointer">
<svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Keyboard Shortcut Hint -->
<span class="text-[11px] font-medium tracking-wide text-slate-400">
          Press <span class="text-slate-300">Space</span> to talk
        </span>
</div>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: BackgroundEtherealWaves -->
<!-- Subtle cyan vector waves glowing across lower background -->
<div aria-hidden="true" class="ethereal-wave">
<svg class="w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 1280 240">
<defs>
<lineargradient id="cyanLineGlow1" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#0284c7" stop-opacity="0"></stop>
<stop offset="25%" stop-color="#0284c7" stop-opacity="0.35"></stop>
<stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"></stop>
<stop offset="75%" stop-color="#0369a1" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#0284c7" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="cyanLineGlow2" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#38bdf8" stop-opacity="0"></stop>
<stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"></stop>
<stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25"></stop>
<stop offset="100%" stop-color="#0284c7" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Primary Subtle Wave -->
<path d="M -50 180 C 250 120, 450 220, 750 150 C 950 100, 1150 180, 1330 140" fill="none" stroke="url(#cyanLineGlow1)" stroke-width="1.8"></path>
<!-- Secondary Gentle Cross Wave -->
<path d="M -30 140 C 220 200, 520 130, 800 190 C 1020 230, 1180 130, 1320 160" fill="none" opacity="0.6" stroke="url(#cyanLineGlow2)" stroke-dasharray="3 3" stroke-width="1.2"></path>
</svg>
</div>
<!-- END: BackgroundEtherealWaves -->
</div>
<!-- END: ElectronWindowContainer -->
</body></html>
