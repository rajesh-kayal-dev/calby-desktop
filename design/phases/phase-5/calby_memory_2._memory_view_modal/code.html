<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby Memory — Memory View Modal</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
<style data-purpose="layout-styles">
    /* Deep workspace base background */
    .workspace-bg {
      background-color: #05080E;
    }
    /* Elevated modal background and borders */
    .modal-surface {
      background-color: #0C101B;
      border-color: #1A2234;
    }
    .inner-box {
      background-color: #0E1424;
      border-color: #1E273D;
    }
    .action-secondary {
      background-color: #141A29;
      border-color: #1F273A;
    }
    .action-secondary:hover {
      background-color: #1A2235;
      border-color: #2D374E;
    }
  </style>
</head>
<body class="workspace-bg text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-600 selection:text-white">
<!-- BEGIN: ElectronDesktopAppWindow -->
<!-- Main Electron window container locked to 1280x680 proportions -->
<main class="w-[1280px] h-[680px] max-w-full max-h-screen rounded-xl border border-[#161D2D] bg-[#070A11] shadow-2xl relative flex flex-col overflow-hidden select-none">
<!-- Desktop Title Bar -->
<header class="h-10 w-full bg-[#080C14] border-b border-[#141B2B] flex items-center justify-between px-4 z-10 shrink-0">
<div class="flex items-center space-x-2.5">
<!-- Calby Soundwave Logo Mark -->
<svg class="w-4 h-4 text-blue-500" fill="currentColor" viewbox="0 0 24 24">
<rect height="6" rx="1.2" width="2.5" x="2" y="9"></rect>
<rect height="14" rx="1.2" width="2.5" x="7" y="5"></rect>
<rect height="20" rx="1.2" width="2.5" x="12" y="2"></rect>
<rect height="10" rx="1.2" width="2.5" x="17" y="7"></rect>
<rect height="4" rx="1.2" width="2.5" x="22" y="10"></rect>
</svg>
<span class="text-xs font-medium text-slate-300 tracking-wide">Calby</span>
</div>
<!-- App Status Indicator -->
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
<span class="text-[11px] text-slate-400 font-medium">Connected</span>
</div>
<!-- Window Control Buttons (Minimize, Maximize, Close) -->
<div class="flex items-center space-x-3 text-slate-400 text-xs">
<button aria-label="Settings" class="hover:text-slate-200 transition-colors" type="button">
<svg class="w-3.5 h-3.5 stroke-[1.75]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-slate-600">|</span>
<button aria-label="Minimize" class="hover:text-slate-200 transition-colors" type="button">
<svg class="w-3.5 h-3.5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 12H5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button aria-label="Maximize" class="hover:text-slate-200 transition-colors" type="button">
<svg class="w-3 h-3 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="2" width="18" x="3" y="3"></rect>
</svg>
</button>
<button aria-label="Close" class="hover:text-red-400 transition-colors" type="button">
<svg class="w-3.5 h-3.5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- App Body Area (Dimmed Background simulating Workspace Backdrop) -->
<div class="relative flex-1 w-full h-[calc(100%-40px)] flex items-center justify-center overflow-hidden bg-[#070A11]/90">
<!-- Subtle Ambient Glow Behind Modal -->
<div class="absolute w-[500px] h-[500px] rounded-full bg-blue-900/10 blur-3xl pointer-events-none -top-24"></div>
<!-- BEGIN: MemoryModalViewMode -->
<div class="modal-surface w-[450px] rounded-xl border border-[#1B2337] shadow-2xl p-6 relative flex flex-col z-20" data-purpose="memory-view-modal">
<!-- Modal Top Bar -->
<div class="flex items-center justify-between pb-5">
<div class="flex items-center space-x-2.5">
<!-- Modal Brand Soundwave -->
<svg class="w-4 h-4 text-blue-500" fill="currentColor" viewbox="0 0 24 24">
<rect height="6" rx="1.2" width="2.5" x="2" y="9"></rect>
<rect height="14" rx="1.2" width="2.5" x="7" y="5"></rect>
<rect height="20" rx="1.2" width="2.5" x="12" y="2"></rect>
<rect height="10" rx="1.2" width="2.5" x="17" y="7"></rect>
<rect height="4" rx="1.2" width="2.5" x="22" y="10"></rect>
</svg>
<span class="text-sm font-medium text-slate-200">Calby</span>
</div>
<!-- Close Modal Icon Button -->
<button aria-label="Dismiss Modal" class="text-slate-400 hover:text-slate-200 transition-colors p-1" type="button">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Modal Title -->
<h2 class="text-xl font-semibold text-white tracking-tight mb-4">Memory</h2>
<!-- Memory Content Preview Card -->
<div class="inner-box border rounded-lg p-4 min-h-[92px] flex items-start" data-purpose="memory-content-box">
<p class="text-sm leading-relaxed text-slate-100 font-normal">
            Rahul handles the payment module.
          </p>
</div>
<!-- Metadata Row: Added Date -->
<div class="flex items-center space-x-2.5 text-xs text-slate-400 mt-4 mb-5">
<svg class="w-4 h-4 stroke-[1.8] text-slate-400 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-linecap="round" stroke-linejoin="round" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Added 18 Sep 2026</span>
</div>
<!-- Subtle Divider Line -->
<hr class="border-t border-[#161E30] w-full mb-5"/>
<!-- Modal Actions Stack -->
<div class="flex flex-col space-y-2.5 w-full">
<!-- Primary Edit Action Button -->
<button class="w-full bg-[#1A73E8] hover:bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold py-2.5 px-4 rounded-md transition duration-150 flex items-center justify-center space-x-2 shadow-sm" type="button">
<svg class="w-3.5 h-3.5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Edit</span>
</button>
<!-- Secondary Delete Action Button -->
<button class="action-secondary border text-xs font-medium text-slate-200 hover:text-red-300 hover:border-red-900/40 py-2.5 px-4 rounded-md transition duration-150 flex items-center justify-center space-x-2" type="button">
<svg class="w-3.5 h-3.5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Delete</span>
</button>
<!-- Dismiss / Close Button -->
<button class="action-secondary border text-xs font-medium text-slate-300 hover:text-white py-2.5 px-4 rounded-md transition duration-150 flex items-center justify-center" type="button">
<span>Close</span>
</button>
</div>
</div>
<!-- END: MemoryModalViewMode -->
</div>
</main>
<!-- END: ElectronDesktopAppWindow -->
</body></html>
