<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby Memory — 3. Memory Edit Modal</title>
<!-- Load Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            calby: {
              bg: '#070A11',
              card: '#0C101A',
              modal: '#0e1422',
              input: '#090d16',
              border: '#1e2638',
              borderLight: '#28344e',
              primary: '#0070f3',
              primaryHover: '#0060df',
              textMuted: '#8b9bb4',
              secondaryBtn: '#141c2b',
              secondaryBtnHover: '#1c263b',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-typography">
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style data-purpose="custom-shadows">
    .modal-glow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 45px rgba(0, 112, 243, 0.06);
    }
    .primary-btn-glow {
      box-shadow: 0 4px 14px rgba(0, 112, 243, 0.4);
    }
    .primary-btn-glow:hover {
      box-shadow: 0 6px 20px rgba(0, 112, 243, 0.6);
    }
  </style>
</head>
<body class="bg-black text-slate-100 flex items-center justify-center min-h-screen p-4 overflow-auto">
<!-- BEGIN: DesktopContainer -->
<!-- Simulated Electron Desktop Window 1280x680 proportions -->
<main class="w-[1280px] h-[680px] max-w-full bg-[#070A11] rounded-2xl border border-calby-border relative overflow-hidden shadow-2xl flex flex-col justify-between">
<!-- Window Title Bar -->
<header class="h-10 px-4 border-b border-calby-border/60 flex items-center justify-between text-xs text-calby-textMuted select-none bg-[#070A11]">
<div class="flex items-center space-x-2">
<span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
<span class="font-medium text-slate-300">Calby</span>
<span class="text-slate-600">|</span>
<span class="text-slate-400">Personal Memory</span>
</div>
<!-- Window Controls -->
<div class="flex items-center space-x-3 text-slate-400">
<button aria-label="Minimize" class="hover:text-white transition-colors" title="Minimize">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M5 12h14"></path></svg>
</button>
<button aria-label="Maximize" class="hover:text-white transition-colors" title="Maximize">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><rect height="16" rx="2" width="16" x="4" y="4"></rect></svg>
</button>
<button aria-label="Close" class="hover:text-red-400 transition-colors" title="Close">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
</div>
</header>
<!-- BEGIN: BlurredWorkspaceBackdrop -->
<!-- Dimmed underlying Memory Workspace matching Phase 5 reference -->
<div class="absolute inset-0 top-10 flex p-8 gap-8 opacity-25 filter blur-[2.5px] pointer-events-none select-none z-0">
<!-- Left Simulated Sidebar/Page -->
<div class="w-80 h-full flex flex-col space-y-4">
<div class="flex items-center space-x-2 text-calby-textMuted text-sm">
<span>← Home</span>
</div>
<h1 class="text-2xl font-bold text-white tracking-tight">Memory</h1>
<p class="text-xs text-calby-textMuted">What Calby remembers about you.</p>
<div class="h-10 bg-[#0C101A] rounded-lg border border-calby-border px-3 flex items-center text-xs text-slate-500">
          Search memories...
        </div>
<div class="space-y-2 mt-4">
<div class="p-3 bg-[#0C101A] rounded-lg border border-calby-border flex items-center space-x-3">
<div class="w-4 h-4 bg-slate-700 rounded"></div>
<div class="flex-1">
<div class="h-3 w-40 bg-slate-700 rounded mb-1"></div>
<div class="h-2 w-20 bg-slate-800 rounded"></div>
</div>
</div>
<div class="p-3 bg-[#0C101A] rounded-lg border border-calby-border flex items-center space-x-3">
<div class="w-4 h-4 bg-slate-700 rounded"></div>
<div class="flex-1">
<div class="h-3 w-32 bg-slate-700 rounded mb-1"></div>
<div class="h-2 w-20 bg-slate-800 rounded"></div>
</div>
</div>
</div>
</div>
<!-- Right Main Blurred Area -->
<div class="flex-1 rounded-xl border border-dashed border-calby-border/40 p-6 flex flex-col justify-center items-center">
<div class="w-16 h-16 rounded-full bg-calby-card border border-calby-border flex items-center justify-center text-calby-textMuted mb-3">
<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<div class="h-3 w-48 bg-slate-800 rounded"></div>
</div>
</div>
<!-- END: BlurredWorkspaceBackdrop -->
<!-- Dimmer Overlay -->
<div class="absolute inset-0 top-10 bg-[#05070D]/75 backdrop-blur-sm z-10"></div>
<!-- BEGIN: EditMemoryModal -->
<!-- Elevated Modal Dialog exactly aligned to Phase 5 Screen 3 (Edit Mode) -->
<div class="relative z-20 flex-1 flex items-center justify-center p-4">
<section class="w-full max-w-[420px] bg-calby-modal rounded-xl border border-calby-border modal-glow flex flex-col overflow-hidden text-slate-200" data-purpose="edit-memory-modal-card">
<!-- Modal Top Bar: Logo & Close -->
<div class="px-5 pt-4 pb-3 flex items-center justify-between border-b border-calby-border/40">
<div class="flex items-center space-x-2">
<!-- Calby Soundwave Icon -->
<span aria-hidden="true" class="flex items-center space-x-[2.5px] text-white">
<span class="w-[2.5px] h-2 bg-white rounded-full"></span>
<span class="w-[2.5px] h-3.5 bg-white rounded-full"></span>
<span class="w-[2.5px] h-5 bg-white rounded-full"></span>
<span class="w-[2.5px] h-3 bg-white rounded-full"></span>
<span class="w-[2.5px] h-1.5 bg-white rounded-full"></span>
</span>
<span class="text-sm font-semibold tracking-wide text-white">Calby</span>
</div>
<!-- Close Icon (X) -->
<button aria-label="Close dialog" class="text-calby-textMuted hover:text-white transition-colors p-1 -mr-1 rounded-md hover:bg-white/5" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</div>
<!-- Modal Header Titles -->
<div class="px-5 pt-5 pb-2">
<h2 class="text-lg font-bold text-white tracking-tight">Edit Memory</h2>
<p class="text-xs text-calby-textMuted mt-0.5">Update this memory.</p>
</div>
<!-- Modal Content: Editable Textarea Container -->
<form class="px-5 py-3 flex-1 flex flex-col" data-purpose="memory-edit-form">
<div class="relative flex-1">
<textarea class="w-full bg-calby-input border border-calby-borderLight focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-lg p-3.5 text-[13px] leading-relaxed text-slate-100 placeholder-slate-500 resize-none outline-none transition-all" id="memory-content-input" placeholder="What should Calby remember?" rows="6">Rahul handles the payment module.</textarea>
</div>
<!-- Actions Footer Row -->
<div class="flex items-center justify-between gap-3 mt-6 mb-2">
<!-- Cancel Button -->
<button class="flex-1 py-2.5 px-4 rounded-lg bg-calby-secondaryBtn hover:bg-calby-secondaryBtnHover border border-calby-border text-xs font-medium text-slate-300 hover:text-white transition-all text-center focus:outline-none focus:ring-1 focus:ring-slate-400" type="button">
              Cancel
            </button>
<!-- Save Button -->
<button class="flex-1 py-2.5 px-4 rounded-lg bg-[#0070f3] hover:bg-[#0060df] text-white text-xs font-medium primary-btn-glow transition-all text-center focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-calby-modal" type="submit">
              Save
            </button>
</div>
</form>
</section>
</div>
<!-- END: EditMemoryModal -->
<!-- Window Bottom Status Bar -->
<footer class="h-6 px-4 border-t border-calby-border/40 flex items-center justify-between text-[11px] text-slate-500 select-none bg-[#070A11] z-20">
<span>Calby v2.4.0</span>
<span>Synced with Cloud Engine</span>
</footer>
</main>
<!-- END: DesktopContainer -->
</body></html>
