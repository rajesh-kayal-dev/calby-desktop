<div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-1/4 w-[500px] h-[300px] rounded-full bg-secondary-container/20 blur-[100px] pointer-events-none"></div>

<div class="relative z-10 p-5 space-y-4">

<div class="flex items-center justify-between">
<div class="flex items-center space-x-2.5">
<!-- Calby Sonic Waveform Logo Glyphs -->
<div class="flex items-center space-x-[3px] py-1 text-primary-container">
<span class="w-1 h-3 rounded-full bg-primary-container inline-block"></span>
<span class="w-1 h-5 rounded-full bg-primary-container inline-block"></span>
<span class="w-1 h-3.5 rounded-full bg-primary-container inline-block"></span>
<span class="w-1 h-6 rounded-full bg-primary-container inline-block"></span>
<span class="w-1 h-2.5 rounded-full bg-primary-container inline-block"></span>
</div>
<span class="font-headline-md text-headline-md text-text-primary tracking-normal">Calby</span>
</div>
<div class="flex items-center space-x-2">
<span class="font-label-sm text-label-sm text-text-muted lowercase tracking-wide">now</span>
<button aria-label="Close notification" class="w-6 h-6 rounded-full flex items-center justify-center text-text-muted hover:text-text-primary hover:bg-surface-overlay transition-colors" id="close-btn" onclick="document.getElementById('calby-toast').classList.add('opacity-30', 'scale-95'); setTimeout(() =&gt; document.getElementById('calby-toast').classList.remove('opacity-30', 'scale-95'), 1800);">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<!-- Notification Main Content: Reminder Details -->
<div class="flex items-start space-x-3.5 pt-1">
<!-- Icon Vessel -->
<div class="w-12 h-12 rounded-xl bg-secondary-container/70 flex items-center justify-center flex-shrink-0 shadow-inner">
<span class="material-symbols-outlined text-primary-container text-[24px]" style="font-variation-settings: 'FILL' 1;">calendar_clock</span>
</div>

<div class="flex items-center space-x-2">

<span class="w-1.5 h-1.5 rounded-full bg-status-warning flex-shrink-0" title="High Priority"></span>
</div>
<p class="font-body-md text-body-md text-text-secondary mt-0.5 leading-snug">It's time for your reminder.</p>
<!-- Subtle Metadata Tag -->
<div class="flex items-center space-x-1.5 mt-2">
<span class="material-symbols-outlined text-text-muted text-[13px]">mic</span>
<span class="font-code-sm text-code-sm text-text-muted">Synced via Voice note • 10:30 AM</span>
</div>
</div>
</div>
<!-- Dual Action CTA Row -->
<div class="grid grid-cols-2 gap-3 pt-2">
<!-- Secondary Action: Snooze -->
<button class="w-full py-2.5 px-4 rounded-lg bg-surface-card hover:bg-surface-overlay active:scale-[0.98] transition-all duration-150 flex items-center justify-center space-x-1.5 shadow-sm group" id="snooze-btn" onclick="let toast = document.getElementById('calby-toast'); toast.classList.add('translate-x-4', 'opacity-0'); setTimeout(() =&gt; toast.classList.remove('translate-x-4', 'opacity-0'), 1500);" type="button">
<span class="material-symbols-outlined text-text-muted group-hover:text-text-primary text-[17px] transition-colors">snooze</span>
<span class="font-label-md text-label-md text-text-secondary group-hover:text-text-primary transition-colors font-medium">Snooze</span>
</button>
<!-- Primary Action: Dismiss -->
<button class="w-full py-2.5 px-4 rounded-lg bg-secondary-container hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center space-x-1.5 shadow-md shadow-secondary-container/20 group" id="dismiss-btn" onclick="let toast = document.getElementById('calby-toast'); toast.classList.add('scale-90', 'opacity-0'); setTimeout(() =&gt; toast.classList.remove('scale-90', 'opacity-0'), 1500);" type="button">
<span class="material-symbols-outlined text-text-primary group-hover:text-on-primary-container text-[17px] transition-colors">check_circle</span>
<span class="font-label-md text-label-md text-text-primary group-hover:text-on-primary-container font-semibold transition-colors">Dismiss</span>
</button>
</div>
</div>
<!-- Micro-progress line indicating active chime decay -->
<div class="h-0.5 w-full bg-surface-subtle overflow-hidden rounded-b-xl">
<div class="h-full bg-primary-container w-3/4 animate-pulse"></div>
</div>
</div>
<!-- Quick Interactive Testing Drawer -->

</div>
<!-- Desktop Taskbar / Shell Footer Simulation -->
<footer class="relative z-10 mt-space-2xl pt-space-lg flex flex-col md:flex-row items-center gap-4 text-text-muted justify-end">
<!-- Voice Loop Philosophy Tag -->

<!-- OS System Tray Emulation -->
<div class="flex items-center space-x-4 bg-surface-subtle/80 backdrop-blur-lg px-4 py-2 rounded-xl shadow-lg">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-text-secondary text-[18px] hover:text-text-primary cursor-pointer transition-colors">keyboard_arrow_up</span>

<div class="flex items-center space-x-1 px-2 py-1 rounded-md bg-surface-card hover:bg-surface-overlay cursor-pointer transition-colors">
<span class="w-1.5 h-1.5 rounded-full bg-status-success animate-pulse"></span>
<span class="material-symbols-outlined text-primary text-[18px]">graphic_eq</span>
</div>
<span class="material-symbols-outlined text-text-secondary text-[18px] hover:text-text-primary cursor-pointer transition-colors">wifi</span>
<span class="material-symbols-outlined text-text-secondary text-[18px] hover:text-text-primary cursor-pointer transition-colors">volume_up</span>
</div>
<div class="h-4 w-px bg-surface-bright"></div>

<div class="flex flex-col text-right leading-none">
<span class="font-label-md text-label-md text-text-primary font-medium">10:24 AM</span>
<span class="font-label-sm text-label-sm text-text-muted mt-0.5">Wed, 17 Sep</span>
</div>
</div>

</div>
