<div class="relative group cursor-pointer transition-transform duration-500 hover:scale-105" id="voiceOrb">
<!-- Outer Glow Pulsing Atmosphere Ring -->

          </span>

<div class="flex items-center">
<button class="flex items-center gap-space-sm px-space-xl py-space-sm rounded-full bg-surface-card hover:bg-surface-overlay text-text-primary shadow-lg shadow-black/40 hover:shadow-primary-container/10 transition-all transform active:scale-95 group" id="spaceTalkBtn">
<span class="material-symbols-outlined text-text-secondary group-hover:text-primary transition-colors text-[18px]">keyboard</span>
<span class="font-label-md text-label-md font-medium tracking-wide">Press Space to talk</span>
</button>
</div>

<div class="hidden sm:block w-36"></div>

<!-- Quick Auxiliary View Switching Bar for Phase 7 Preview Flow -->

</div>
<script>
    (function() {
      const spaceBtn = document.getElementById('spaceTalkBtn');
      const voiceOrb = document.getElementById('voiceOrb');
      
      let isListening = true;

      function toggleState() {
        isListening = !isListening;
        if (voiceOrb) {
          if (isListening) {
            voiceOrb.classList.add('scale-105');
          } else {
            voiceOrb.classList.remove('scale-105');
          }
        }
      }

      if (spaceBtn) {
        spaceBtn.addEventListener('click', toggleState);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          toggleState();
        }
      });
    })();
  </script>
