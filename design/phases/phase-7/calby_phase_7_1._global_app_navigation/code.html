<div class="w-full max-w-[1240px] aspect-[1280/680] min-h-[620px] max-h-[740px] bg-surface-dim rounded-xl shadow-2xl flex flex-col relative overflow-hidden select-none">
<div class="absolute inset-0 pointer-events-none opacity-40 bg-[radial-gradient(ellipse_60%_40%_at_50%_65%,rgba(56,189,248,0.18),transparent_75%)]"></div>
<div class="absolute -bottom-16 -left-16 w-96 h-96 rounded-full bg-secondary-container/10 blur-3xl pointer-events-none"></div>
<div class="absolute -top-16 -right-16 w-80 h-80 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
<!-- App Header Bar -->
<div class="h-12 w-full px-5 bg-surface-container-lowest/80 backdrop-blur-md flex items-center justify-between z-20 shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px] animate-pulse">graphic_eq</span>
<span class="font-headline-md text-headline-md text-text-primary tracking-tight font-semibold">Calby</span>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-surface-subtle">
<span class="w-2 h-2 rounded-full bg-status-success shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-ping opacity-75"></span>
<span class="w-1.5 h-1.5 -ml-3.5 rounded-full bg-status-success"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-normal">Connected</span>
</div>
<button class="text-text-muted hover:text-text-primary transition-colors p-1 rounded-md hover:bg-surface-card" id="header-settings-btn" title="Settings">
<span class="material-symbols-outlined text-[19px]">settings</span>
</button>
<div class="flex items-center gap-1.5 pl-2 text-text-muted">
<button class="w-6 h-6 rounded flex items-center justify-center hover:bg-surface-card hover:text-text-primary transition-colors text-xs">—</button>
<button class="w-6 h-6 rounded flex items-center justify-center hover:bg-surface-card hover:text-text-primary transition-colors text-xs">▢</button>
<button class="w-6 h-6 rounded flex items-center justify-center hover:bg-status-error hover:text-white transition-colors text-xs">✕</button>
</div>
</div>
</div>
<!-- Navigation Tabs Bar -->
<div class="w-full bg-surface-subtle/70 px-6 py-2.5 flex items-center z-20 shrink-0">
<nav class="flex items-center gap-2" id="desktop-nav-group">
<button class="nav-tab active flex items-center gap-2 px-5 py-2 rounded-lg bg-surface-overlay text-primary font-label-md text-label-md transition-all shadow-sm" data-nav="home">
<span class="material-symbols-outlined text-[18px]">home</span>
<span class="font-medium text-text-primary">Home</span>
</button>
<button class="nav-tab flex items-center gap-2 px-5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-card/60 font-label-md text-label-md transition-all" data-nav="reminders">
<span class="material-symbols-outlined text-[18px]">notifications</span>
<span class="">Reminders</span>
</button>
<button class="nav-tab flex items-center gap-2 px-5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-card/60 font-label-md text-label-md transition-all" data-nav="calendar">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="">Calendar</span>
</button>
<button class="nav-tab flex items-center gap-2 px-5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-card/60 font-label-md text-label-md transition-all" data-nav="memory">
<span class="material-symbols-outlined text-[18px]">memory</span>
<span class="">Memory</span>
</button>
<button class="nav-tab flex items-center gap-2 px-5 py-2 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-card/60 font-label-md text-label-md transition-all" data-nav="settings">
<span class="material-symbols-outlined text-[18px]">tune</span>
<span class="">Settings</span>
</button>
</nav>
</div>
<!-- Main Ambient Body Container -->
<div class="flex-1 w-full flex flex-col items-center justify-between px-8 py-6 z-10 relative">
<!-- Greeting Typography Area -->
<div class="flex flex-col items-center text-center mt-3">
<h1 class="font-headline-xl text-headline-xl text-text-primary tracking-tight font-semibold">
            Good morning, <span class="text-primary font-normal">Rajesh</span>
</h1>
<p class="font-body-lg text-body-lg text-text-secondary mt-1.5 font-normal tracking-wide">
            How can I help you today?
          </p>
</div>
<!-- Central Voice Orb Area -->
<div class="relative flex items-center justify-center my-auto py-2">
<!-- Outer diffused luminous halos -->
<div class="absolute w-56 h-56 rounded-full bg-primary/10 blur-2xl transition-all duration-700 pointer-events-none animate-pulse" id="orb-outer-halo"></div>
<div class="absolute w-44 h-44 rounded-full bg-secondary-container/20 blur-xl transition-all duration-500 pointer-events-none" id="orb-mid-halo"></div>
<!-- Secondary subtle ripple concentric ring -->
<div class="absolute w-[184px] h-[184px] rounded-full bg-primary/5 shadow-[0_0_40px_rgba(56,189,248,0.12)]"></div>
<!-- Orb Interactive Container -->
<button class="group relative w-36 h-36 rounded-full bg-surface-card shadow-2xl flex items-center justify-center cursor-pointer transition-transform duration-300 active:scale-95 focus:outline-none overflow-hidden" id="calby-voice-orb">
<!-- Glassmorphic depth overlay within orb -->
<div class="absolute inset-0 rounded-full bg-gradient-to-b from-primary/20 via-transparent to-surface-container-lowest/80 pointer-events-none"></div>
<div class="absolute inset-1 rounded-full bg-surface-dim pointer-events-none"></div>
<!-- Radial center glow -->
<div class="absolute w-20 h-20 rounded-full bg-primary/20 blur-md transition-all duration-300 group-hover:scale-125" id="orb-glow-core"></div>
<!-- Waveform Sound Bars -->
<div class="relative z-10 flex items-center justify-center gap-1.5 h-14">
<span class="waveform-bar w-1 rounded-full bg-primary transition-all duration-200" style="height: 18px;"></span>
<span class="waveform-bar w-1 rounded-full bg-primary transition-all duration-200" style="height: 32px;"></span>
<span class="waveform-bar w-1.5 rounded-full bg-text-primary shadow-[0_0_8px_#38BDF8] transition-all duration-200" style="height: 48px;"></span>
<span class="waveform-bar w-1 rounded-full bg-primary transition-all duration-200" style="height: 32px;"></span>
<span class="waveform-bar w-1 rounded-full bg-primary transition-all duration-200" style="height: 18px;"></span>
</div>
</button>
</div>
<!-- Talk Bar / Shortcut Hint -->
<div class="flex flex-col items-center mb-1">
<button class="group flex items-center gap-2.5 px-6 py-2.5 rounded-full bg-surface-overlay/80 hover:bg-surface-overlay text-on-surface-variant hover:text-text-primary shadow-lg transition-all duration-200 active:scale-98" id="space-trigger-btn">
<span class="material-symbols-outlined text-[19px] text-text-muted group-hover:text-primary transition-colors">keyboard</span>
<span class="font-label-md text-label-md tracking-wide font-normal text-text-secondary group-hover:text-text-primary" id="voice-state-text">Press Space to talk</span>
</button>
</div>
<!-- Window Footnote -->
<div class="w-full flex items-center justify-start pt-2">
<span class="font-label-sm text-label-sm text-text-muted/80 tracking-normal font-normal">
            Your time, understood.
          </span>
</div>
</div>
</div>
</div>
</div>
<script>
(function() {
  const orb = document.getElementById('calby-voice-orb');
  const orbOuterHalo = document.getElementById('orb-outer-halo');
  const orbGlowCore = document.getElementById('orb-glow-core');
  const voiceStateText = document.getElementById('voice-state-text');
  const spaceTriggerBtn = document.getElementById('space-trigger-btn');
  const bars = document.querySelectorAll('.waveform-bar');
  const navTabs = document.querySelectorAll('.nav-tab');

  let isListening = false;
  let waveInterval = null;

  function setListening(active) {
    isListening = active;
    if (isListening) {
      voiceStateText.textContent = 'Listening... Speak now';
      orbOuterHalo.classList.remove('bg-primary/10', 'blur-2xl');
      orbOuterHalo.classList.add('bg-primary/30', 'blur-3xl', 'scale-125');
      orbGlowCore.classList.remove('bg-primary/20');
      orbGlowCore.classList.add('bg-primary/60');
      spaceTriggerBtn.classList.add('bg-primary/20');

      waveInterval = setInterval(() => {
        bars.forEach((bar, idx) => {
          const randomH = Math.floor(Math.random() * 38) + 14;
          bar.style.height = `${randomH}px`;
        });
      }, 110);
    } else {
      voiceStateText.textContent = 'Press Space to talk';
      orbOuterHalo.classList.add('bg-primary/10', 'blur-2xl');
      orbOuterHalo.classList.remove('bg-primary/30', 'blur-3xl', 'scale-125');
      orbGlowCore.classList.add('bg-primary/20');
      orbGlowCore.classList.remove('bg-primary/60');
      spaceTriggerBtn.classList.remove('bg-primary/20');

      if (waveInterval) clearInterval(waveInterval);
      const defaultHeights = [18, 32, 48, 32, 18];
      bars.forEach((bar, idx) => {
        bar.style.height = `${defaultHeights[idx]}px`;
      });
    }
  }

  if (orb) {
    orb.addEventListener('click', () => setListening(!isListening));
  }

  if (spaceTriggerBtn) {
    spaceTriggerBtn.addEventListener('click', () => setListening(!isListening));
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      setListening(!isListening);
    }
  });

  navTabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      navTabs.forEach((t) => {
        t.classList.remove('bg-surface-overlay', 'text-primary');
        t.classList.add('text-text-secondary');
        const textSpan = t.querySelector('span:not(.material-symbols-outlined)');
        if (textSpan) {
          textSpan.classList.remove('text-text-primary', 'font-medium');
        }
      });
      tab.classList.add('bg-surface-overlay', 'text-primary');
      tab.classList.remove('text-text-secondary');
      const activeTextSpan = tab.querySelector('span:not(.material-symbols-outlined)');
      if (activeTextSpan) {
        activeTextSpan.classList.add('text-text-primary', 'font-medium');
      }
    });
  });
})();
</script></main>

</body></html>
