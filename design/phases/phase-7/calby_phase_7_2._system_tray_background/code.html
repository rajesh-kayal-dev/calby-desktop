    const flyout = document.getElementById('tray-flyout');

      trigger.addEventListener('click', () => {
        flyout.classList.toggle('opacity-0');
        flyout.classList.toggle('translate-y-4');
        flyout.classList.toggle('pointer-events-none');
      });
    }
