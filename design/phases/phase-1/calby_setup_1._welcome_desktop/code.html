<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calby - First Launch &amp; Setup</title>
<!-- Tailwind CSS v3 with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#070A11',
              surface: '#0C101A',
              card: '#121826',
              border: '#1E293B',
              accent: '#2563EB',
              accentHover: '#1D4ED8',
              cyanGlow: '#38BDF8'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom App Styles -->
<style data-purpose="custom-decorations">
    .horizon-silhouette {
      background: radial-gradient(ellipse 80% 50% at 30% 60%, rgba(14, 42, 82, 0.35) 0%, rgba(7, 10, 17, 0) 70%);
    }
    .soundwave-glow {
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.45));
    }
    .btn-glow {
      box-shadow: 0 0 20px -2px rgba(37, 99, 235, 0.5), 0 0 10px -1px rgba(56, 189, 248, 0.3);
    }
    .btn-glow:hover {
      box-shadow: 0 0 26px 0px rgba(37, 99, 235, 0.65), 0 0 14px 1px rgba(56, 189, 248, 0.45);
    }
  </style>
<!-- END: Custom App Styles -->
</head>
<body class="bg-[#03060C] text-slate-100 flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-10 select-none font-sans antialiased">
<!-- BEGIN: Electron Desktop Window Frame Container -->
<main class="w-full max-w-[1040px] h-[640px] bg-[#070A11] border border-slate-800/80 rounded-xl shadow-2xl flex flex-col relative overflow-hidden ring-1 ring-white/5" data-purpose="electron-app-window">
<!-- BEGIN: App TitleBar -->
<header class="h-10 px-4 flex items-center justify-between border-b border-slate-800/60 bg-[#090D17]/90 backdrop-blur-md z-30 shrink-0 select-none" data-purpose="window-titlebar">
<!-- Left side: App Icon & Name -->
<div class="flex items-center gap-2.5">
<!-- Mini soundwave logo -->
<svg class="w-4 h-4 text-[#38BDF8]" fill="currentColor" viewbox="0 0 16 16">
<circle cx="2" cy="8" r="1.2"></circle>
<path d="M5.5 4.5a.8.8 0 0 1 .8.8v5.4a.8.8 0 1 1-1.6 0V5.3a.8.8 0 0 1 .8-.8zm3-3a.8.8 0 0 1 .8.8v11.4a.8.8 0 1 1-1.6 0V2.3a.8.8 0 0 1 .8-.8zm3 3a.8.8 0 0 1 .8.8v5.4a.8.8 0 1 1-1.6 0V5.3a.8.8 0 0 1 .8-.8z"></path>
<circle cx="14" cy="8" r="1.2"></circle>
</svg>
<span class="text-xs font-medium text-slate-300 tracking-wide">Calby</span>
</div>
<!-- Right side: Window Controls (Minimize, Maximize, Close) -->
<div class="flex items-center space-x-3 text-slate-400">
<!-- Minimize -->
<button aria-label="Minimize" class="p-1 hover:text-slate-200 transition-colors" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19.5 12h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Restore / Maximize -->
<button aria-label="Maximize" class="p-1 hover:text-slate-200 transition-colors" type="button">
<svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect>
</svg>
</button>
<!-- Close -->
<button aria-label="Close" class="p-1 hover:text-red-400 transition-colors" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: App TitleBar -->
<!-- BEGIN: Main Desktop Setup Content -->
<div class="flex-1 flex flex-col justify-between p-8 sm:p-12 relative z-20 overflow-hidden" data-purpose="screen-content">
<!-- Ambient Hero Visual Background -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none horizon-silhouette -z-10">
<!-- Mountain Silhouettes SVG spanning background -->
<svg class="absolute bottom-0 left-0 right-0 w-full opacity-20 pointer-events-none" fill="none" preserveaspectratio="none" viewbox="0 0 1000 240">
<path d="M0,240 L0,160 L140,90 L260,160 L410,70 L550,140 L700,80 L850,150 L1000,90 L1000,240 Z" fill="#1e293b"></path>
<path d="M0,240 L0,190 L180,120 L320,180 L470,110 L620,170 L770,120 L910,170 L1000,135 L1000,240 Z" fill="#0C101A"></path>
</svg>
</div>
<!-- 2-Column Wide Desktop Canvas -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 lg:gap-12 items-center my-auto">
<!-- Left Hero Column: Brand, Soundwave & Main Headings -->
<div class="md:col-span-6 flex flex-col items-center md:items-start text-center md:text-left">
<!-- Calby Soundwave Brand Icon -->
<div class="mb-5 text-[#38BDF8] soundwave-glow" data-purpose="calby-brand-symbol">
<svg class="w-16 h-16" fill="none" stroke="currentColor" stroke-linecap="round" viewbox="0 0 48 48">
<!-- Left outer dot -->
<circle cx="8" cy="24" fill="currentColor" r="1.5" stroke="none"></circle>
<!-- Inner-left bar -->
<line stroke-width="3.2" x1="16" x2="16" y1="17" y2="31"></line>
<!-- Center taller main bar -->
<line stroke-width="3.6" x1="24" x2="24" y1="9" y2="39"></line>
<!-- Inner-right bar -->
<line stroke-width="3.2" x1="32" x2="32" y1="17" y2="31"></line>
<!-- Right outer dot -->
<circle cx="40" cy="24" fill="currentColor" r="1.5" stroke="none"></circle>
</svg>
</div>
<!-- Typography Heading -->
<h1 class="text-4xl lg:text-5xl font-semibold text-white tracking-tight mb-2">Calby</h1>
<p class="text-lg text-slate-400 font-normal max-w-sm">A more capable you.</p>
<div class="mt-8 hidden md:flex items-center gap-2 text-xs text-slate-500 font-medium">
<span class="inline-block w-2 h-2 rounded-full bg-[#38BDF8] animate-pulse"></span>
<span>Desktop Assistant • Setup Ready</span>
</div>
</div>
<!-- Right Column: Capability Highlight Panels -->
<div class="md:col-span-6 space-y-3.5" data-purpose="feature-highlights">
<!-- Feature 1: Talk naturally -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-[#0C101A]/80 border border-slate-800/80 hover:border-slate-700/80 transition-colors backdrop-blur-sm shadow-sm">
<div class="w-10 h-10 rounded-lg bg-[#121826] border border-slate-700/60 flex items-center justify-center shrink-0 text-[#38BDF8] shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-200 leading-snug">Talk naturally</h2>
<p class="text-xs text-slate-400 leading-relaxed mt-0.5">Just speak. Calby understands.</p>
</div>
</div>
<!-- Feature 2: Get things done -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-[#0C101A]/80 border border-slate-800/80 hover:border-slate-700/80 transition-colors backdrop-blur-sm shadow-sm">
<div class="w-10 h-10 rounded-lg bg-[#121826] border border-slate-700/60 flex items-center justify-center shrink-0 text-[#38BDF8] shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-200 leading-snug">Get things done</h2>
<p class="text-xs text-slate-400 leading-relaxed mt-0.5">Reminders, calendar, memory and more.</p>
</div>
</div>
<!-- Feature 3: Your data stays on your device -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-[#0C101A]/80 border border-slate-800/80 hover:border-slate-700/80 transition-colors backdrop-blur-sm shadow-sm">
<div class="w-10 h-10 rounded-lg bg-[#121826] border border-slate-700/60 flex items-center justify-center shrink-0 text-[#38BDF8] shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-200 leading-snug">Your data stays on your device</h2>
<p class="text-xs text-slate-400 leading-relaxed mt-0.5">Private, secure, and in your control.</p>
</div>
</div>
</div>
</div>
<!-- Bottom Desktop Action Footer Section -->
<footer class="pt-6 border-t border-slate-800/50 flex items-center justify-between z-20 shrink-0" data-purpose="screen-action-footer">
<div class="flex items-center gap-3">
<!-- Step progress indicators -->
<div class="flex items-center gap-1.5">
<span class="w-6 h-1.5 rounded-full bg-[#38BDF8]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
</div>
<span class="text-xs font-medium text-slate-500">Step 1 of 5</span>
</div>
<button aria-label="Get Started with Calby" class="px-7 h-11 bg-[#2563EB] hover:bg-[#1D4ED8] active:bg-[#1E40AF] text-white font-medium rounded-lg text-sm flex items-center justify-center gap-2.5 transition duration-150 btn-glow focus:outline-none focus:ring-2 focus:ring-blue-500/50" type="button">
<span>Get Started</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
</div>
<!-- END: Main Desktop Setup Content -->
</main>
<!-- END: Electron Desktop Window Frame Container -->
</body></html>
