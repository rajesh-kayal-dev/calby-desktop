appId: com.calby.desktop
productName: Calby
electronVersion: 29.4.6
directories:
  output: dist
  buildResources: build
files:
  - '!**/*'
  - 'out/**/*'
extraResources:
  - from: '../../assets/sounds'
    to: 'assets/sounds'
  - from: '../../assets/icon.png'
    to: 'assets/icon.png'
win:
  target:
    - target: dir
      arch:
        - x64
  signAndEditExecutable: false